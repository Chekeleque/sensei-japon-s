<!DOCTYPE html>
<html lang="ja">

<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sensei Multi-Modo</title>
        <style>
                body {
                        background: #121212;
                        color: white;
                        font-family: sans-serif;
                        padding: 10px;
                        margin: 0;
                }

                .box {
                        border: 1px solid #00ffcc;
                        border-radius: 12px;
                        padding: 15px;
                        background: #1e1e1e;
                        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
                }

                h3 {
                        color: #00ffcc;
                        text-align: center;
                        margin: 0 0 10px 0;
                        font-size: 1.1rem;
                }

                textarea {
                        width: 100%;
                        background: #2a2a2a;
                        color: white;
                        border: 1px solid #444;
                        border-radius: 8px;
                        padding: 10px;
                        box-sizing: border-box;
                        font-size: 1rem;
                }

                .modos {
                        display: flex;
                        gap: 5px;
                        margin-bottom: 10px;
                        overflow-x: auto;
                        padding-bottom: 5px;
                }

                .modo-btn {
                        background: #333;
                        color: #aaa;
                        border: 1px solid #555;
                        padding: 5px 10px;
                        border-radius: 20px;
                        font-size: 0.75rem;
                        white-space: nowrap;
                        cursor: pointer;
                }

                .modo-btn.active {
                        background: #00ffcc;
                        color: black;
                        border-color: #00ffcc;
                        font-weight: bold;
                }

                .btns {
                        display: flex;
                        gap: 5px;
                        margin-top: 5px;
                        flex-wrap: wrap;
                }

                button {
                        padding: 12px;
                        border: none;
                        border-radius: 8px;
                        font-weight: bold;
                        cursor: pointer;
                        transition: 0.2s;
                }

                .b-ana {
                        background: #00ffcc;
                        color: black;
                        flex: 2;
                }

                .b-copy {
                        background: #4a90e2;
                        color: white;
                        width: 45px;
                }

                .b-voz {
                        background: #ffcc00;
                        color: black;
                        width: 45px;
                }

                .b-deepl {
                        background: #29b6f6; /* Un tono de azul para DeepL */
                        color: white;
                        width: 45px;
                }
                .b-furi {
                        background: #9b59b6; /* Púrpura para Furigana */
                        color: white;
                        width: 45px;
                }
                .b-del {
                        background: #ff4444;
                        color: white;
                        width: 45px;
                }

                #res {
                        margin-top: 15px;
                        font-size: 0.95rem;
                        line-height: 1.6;
                        max-height: 400px;
                        overflow-y: auto;
                        color: #eee;
                        border-top: 1px solid #333;
                        padding-top: 10px;
                }
        </style>
</head>

<body>
        <div class="box">
                <h3>⛩️ SENSEI MULTI-MODO</h3>

                <div class="modos" id="modosContainer">
                        <div class="modo-btn active" onclick="setModo(this, 'general')">Estándar</div>
                        <div class="modo-btn" onclick="setModo(this, 'kanji')">Etimo-Kanji</div>
                        <div class="modo-btn" onclick="setModo(this, 'slang')">Coloquial vs Formal</div>
                        <div class="modo-btn" onclick="setModo(this, 'ejemplos')">+3 Ejemplos</div>
                </div>

                <textarea id="txt" rows="2" placeholder="Pega el japonés aquí...">こんにちは</textarea>

                <div class="btns">
                        <button class="b-ana" onclick="go()">ANALIZAR</button>
                        <button class="b-deepl" onclick="translateWithDeepL()">🇪🇸</button>
                        <button class="b-furi" onclick="getFurigana()">あ</button>
                        <button class="b-copy" onclick="copyRes()">📋</button>
                        <button class="b-voz" onclick="say()">🔊</button>
                        <button class="b-del" onclick="clr()">✕</button>
                </div>
                <div id="res">Elige un modo y presiona analizar.</div>
        </div>

        <script>
                const prompts = {
                        general: "Analiza gramaticalmente. Traduce al español, da furigana y explica brevemente cada palabra. Usa negritas.",
                        kanji: "Analiza los Kanjis de la frase. Explica sus radicales, significado individual y origen etimológico brevemente. Todo en español.",
                        slang: "Explica la frase original y luego muestra cómo se diría en registro formal (Keigo) y en registro informal (slang de calle). Explica las diferencias de matiz en español.",
                        ejemplos: "Analiza la frase y luego genera 3 oraciones adicionales usando la misma estructura gramatical pero con diferentes palabras. Tradúcelas al español.",
                        furigana: "Convierte el texto a formato HTML usando etiquetas <ruby> y <rt> para mostrar el furigana sobre todos los Kanjis. Devuelve SOLAMENTE el código HTML resultante sin bloques de código."
                };

                let modoActual = 'general';

                function setModo(btn, modo) {
                        document.querySelectorAll('.modo-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        modoActual = modo;
                }

                async function go() {
                        const out = document.getElementById('res');
                        const inpt = document.getElementById('txt').value;
                        if (!inpt.trim()) return;
                        out.innerHTML = `<i>Sensei analizando...</i>`;

                        try {
                                const response = await fetch('/api/ai-proxy', {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({
                                                service: 'gemini',
                                                input: inpt,
                                                prompt: prompts[modoActual]
                                        })
                                });

                                const data = await response.json();

                                if (response.ok && data.text) {
                                        let respuesta = data.text;
                                        out.innerHTML = respuesta.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<b style="color:#00ffcc">$1</b>');
                                } else {
                                        const errorMsg = data.error || 'Error desconocido';
                                        out.innerHTML = `<b style='color:red'>Error:</b> ${errorMsg}`;
                                }
                        } catch (e) {
                                out.innerHTML = `<b style='color:red'>Error:</b> No se pudo conectar con el servidor proxy.`;
                        }
                }

                async function translateWithDeepL() {
                        const out = document.getElementById('res');
                        const inpt = document.getElementById('txt').value;
                        if (!inpt.trim()) return;
                        out.innerHTML = `<i>Traduciendo con DeepL...</i>`;

                        try {
                                const response = await fetch('/api/ai-proxy', {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({
                                                service: 'deepl', // Indicamos que es para DeepL
                                                input: inpt,
                                                target_lang: 'ES'
                                        })
                                });

                                const data = await response.json();

                                if (data.translations && data.translations[0].text) {
                                        out.innerHTML = `<b>Traducción DeepL:</b><br>${data.translations[0].text}`;
                                } else {
                                        const errorMsg = data.error || 'Error desconocido en DeepL.';
                                        out.innerHTML = `<b style='color:red'>Error DeepL:</b> ${errorMsg}`;
                                }
                        } catch (e) {
                                out.innerHTML = `<b style='color:red'>Error de conexión (DeepL):</b> ${e.message}<br><small>Asegúrate de que tu proxy esté funcionando correctamente.</small>`;
                        }
                }

                async function getFurigana() {
                        const out = document.getElementById('res');
                        const inpt = document.getElementById('txt').value;
                        if (!inpt.trim()) return;
                        out.innerHTML = `<i>Generando Furigana...</i>`;

                        try {
                                const response = await fetch('/api/ai-proxy', {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({
                                                service: 'gemini',
                                                input: inpt,
                                                prompt: prompts.furigana
                                        })
                                });

                                const data = await response.json();

                                if (response.ok && data.text) {
                                        // Limpiamos posibles backticks que la IA a veces agrega
                                        let respuesta = data.text.replace(/```html|```/g, '');
                                        out.innerHTML = `<div style="font-size: 1.5rem; padding: 10px;">${respuesta}</div>`;
                                } else {
                                        const errorMsg = data.error || 'Error al generar furigana';
                                        out.innerHTML = `<b style='color:red'>Error:</b> ${errorMsg}`;
                                }
                        } catch (e) {
                                out.innerHTML = `<b style='color:red'>Error:</b> No se pudo conectar con el proxy.`;
                        }
                }

                async function copyRes() {
                        const resDiv = document.getElementById("res");
                        try {
                            await navigator.clipboard.writeText(resDiv.innerText);
                            const btn = document.querySelector('.b-copy');
                            btn.textContent = "✅";
                            setTimeout(() => btn.textContent = "📋", 2000);
                        } catch (err) {
                            console.error('Error al copiar: ', err);
                        }
                }

                function say() {
                        const ut = new SpeechSynthesisUtterance(document.getElementById('txt').value);
                        ut.lang = 'ja-JP';
                        window.speechSynthesis.speak(ut);
                }

                function clr() {
                        document.getElementById('txt').value = "";
                        document.getElementById('res').innerHTML = "Listo.";
                }
        </script>
</body>

</html>
